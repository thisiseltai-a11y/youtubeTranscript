<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Lot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --road:#463a30;
    --road-edge:#352c25;
    --road-line:#f2e9d8;
    --lawn:#6e8c4e;
    --lawn-dark:#5d7842;
    --house:#f6f1e4;
    --house-shadow:#d9d0ba;
    --roof:#33475b;
    --roof-dark:#263544;
    --car-red:#c1443c;
    --car-red-dark:#9a332c;
    --gold:#d8a94e;
    --gold-dark:#b98a34;
    --ink:#241c15;
    --ink-soft:#4a4034;
    --paper:#fbf6ec;
    --paper-edge:#e7dcc4;
    --sold-tag:#7a8f6a;
  }
  *{box-sizing:border-box;}
  /* .scrim sets an unconditional `display` value, which - being author
     CSS - otherwise overrides the browser default `[hidden]{display:none}`
     regardless of selector specificity. Force hidden to actually mean
     hidden. */
  [hidden]{display:none !important;}
  body{
    margin:0;
    min-height:100vh;
    background-color:var(--lawn);
    background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAgUlEQVR4nGPM6/H7z0ABYMIl8fHdN6xiMEzQAH4hLgxD+IW4GPiFuLC7AKZYSIgPRQMygMkhi7Oga3r37hNWF2HzEtwAXJrQbcYGUMIAl0J8FjAha7x/5wVel+A0AGYDeqARbQAlYJAYgC+aiDLg3btPOBMKIQvgXsAXAwTTASUAACBdL0ftzYr+AAAAAElFTkSuQmCC");
    background-repeat:repeat;
    background-size:32px 32px;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    font-family:'Karla', ui-sans-serif, system-ui, sans-serif;
    color:var(--ink);
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', ui-rounded, system-ui, sans-serif;
  }
  .mono{
    font-family:'Space Mono', ui-monospace, SFMono-Regular, monospace;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:18px 24px;
    background:rgba(251,246,236,0.92);
    backdrop-filter:blur(6px);
    border-bottom:3px solid var(--gold);
    box-shadow:0 2px 10px rgba(36,28,21,0.15);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    margin:0;
    font-size:1.6rem;
    font-weight:800;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  .brand span.tag{
    font-size:0.78rem;
    color:var(--ink-soft);
    font-family:'Karla',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .stats{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .header-actions{
    display:flex;
    gap:10px;
  }
  .stat{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6px 14px;
    border-radius:10px;
    background:var(--paper);
    border:1.5px solid var(--paper-edge);
    min-width:64px;
  }
  .stat b{
    font-family:'Space Mono',monospace;
    font-size:1.15rem;
    font-variant-numeric:tabular-nums;
  }
  .stat small{
    font-size:0.65rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
  }
  .stat.for-sale b{color:var(--car-red-dark);}
  .stat.sold b{color:var(--sold-tag);}

  button{
    font-family:'Karla',sans-serif;
    font-weight:700;
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:0.92rem;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:focus-visible{outline:3px solid var(--gold-dark); outline-offset:2px;}
  .btn-primary{
    background:var(--gold);
    color:var(--ink);
    box-shadow:0 2px 0 var(--gold-dark);
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 3px 0 var(--gold-dark);}
  .btn-primary:active{transform:translateY(1px); box-shadow:0 1px 0 var(--gold-dark);}
  .btn-ghost{
    background:transparent;
    border:1.5px solid var(--paper-edge);
    color:var(--ink-soft);
  }
  .btn-ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn-danger{
    background:transparent;
    color:var(--car-red-dark);
    border:1.5px solid var(--car-red);
  }
  .btn-danger:hover{background:var(--car-red); color:#fff;}

  /* ---------- street ---------- */
  main{
    position:relative;
    max-width:1100px;
    margin:0 auto;
    padding:48px 16px 120px;
  }
  .empty-state{
    text-align:center;
    color:var(--paper);
    padding:80px 20px;
  }
  .empty-state h2{margin:0 0 8px; font-size:1.5rem;}
  .empty-state p{margin:0 0 20px; color:rgba(251,246,236,0.85);}

  .street{
    display:flex;
    flex-direction:column;
  }
  .houses-row{
    display:flex;
    align-items:flex-start;
    gap:16px;
    overflow-x:auto;
    overflow-y:hidden;
  }
  /* Each street segment: a near-side row, then the road, then (once
     there are enough cars to need it) a far-side row of houses mirrored
     to face back across it. Segments stack vertically - once one fills
     up (see BLOCK_SIZE), a new one starts below rather than growing the
     same row wider forever. */
  .block{
    margin-bottom:48px;
  }
  .block:last-child{
    margin-bottom:0;
  }
  /* Keeps a far-row column's position aligned under its near-row
     counterpart when that column's far side isn't filled yet - same
     width as .lawn, since that's what actually sets a house-wrap's
     width via align-items:center. */
  .house-slot-empty{
    width:240px;
    flex:0 0 auto;
  }
  .road-h{
    height:56px;
    margin:14px 0;

       tiling it (like the old hand-pixel version did) would show its
       own dash spacing as uneven at the repeat seam, since the source

       seam to show. */

  .house-wrap:focus-visible{outline:3px solid var(--gold-dark); outline-offset:4px; border-radius:8px;}

  .lawn{
    position:relative;
    width:240px;
    height:120px;
    background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAgUlEQVR4nGPM6/H7z0ABYMIl8fHdN6xiMEzQAH4hLgxD+IW4GPiFuLC7AKZYSIgPRQMygMkhi7Oga3r37hNWF2HzEtwAXJrQbcYGUMIAl0J8FjAha7x/5wVel+A0AGYDeqARbQAlYJAYgC+aiDLg3btPOBMKIQvgXsAXAwTTASUAACBdL0ftzYr+AAAAAElFTkSuQmCC");
    background-repeat:repeat;
    background-size:32px 32px;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    outline:2px solid var(--lawn-dark);
    outline-offset:-2px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .driveway{
    width:62px;
    height:70px;
    background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAa0lEQVR4nGPsaSr4z0ABYGFgYGCQkZEh2wAmYhUKCAoRNgCXIgYGBoYP798RNgCXInyWEO0FXJaQbAA6wGkAvvAgygB84YFsOFleQDacemFArJ9xGkBMGsBrAD6Az3VYDUDXgM91WA0gxTsAOEka873CO8kAAAAASUVORK5CYII=");
    background-repeat:repeat;
    background-size:32px 32px;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    outline:2px solid var(--road-edge);
    outline-offset:-2px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:2px;
  }

  .sprite{
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    display:block;
  }
  .sprite-car{
    width:58px;
    height:49px;
    /* This one sprite is a downscaled photo-style reference image, not a
       hand-pixelled flat-color sprite like the rest of the scene - crisp
       nearest-neighbor scaling (image-rendering:pixelated, set globally
       on .sprite) would just show its blur blockily, so smooth it instead. */
    image-rendering:auto;
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .sprite-house{
    width:150px;
    height:150px;
  }
  .sprite-bush{
    width:36px;
    height:29px;
    position:absolute;
    top:7px;
    left:7px;
  }

  .lot-tag{
    margin-bottom:6px;
    font-family:'Space Mono', monospace;
    font-size:0.72rem;
    font-weight:700;
    color:var(--ink);
    background:var(--paper);
    border:1.5px solid var(--paper-edge);
    border-radius:6px;
    padding:3px 9px;
    letter-spacing:0.02em;
  }
  .sold-tag{
    margin-top:4px;
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--sold-tag);
    font-weight:700;
  }

  /* ---------- garage ---------- */
  .garage-grid{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
  }
  .garage-bay{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    width:150px;
    padding:18px 10px 14px;
    border-radius:12px;
    border:1.5px solid var(--paper-edge);
    background:
      linear-gradient(180deg, rgba(36,28,21,0.08) 0%, rgba(36,28,21,0) 45%),
      repeating-linear-gradient(90deg, #d9d3c5 0 3px, #c9c2b2 3px 6px, #d9d3c5 6px 75px);
    cursor:pointer;
    font-family:inherit;
    transition:transform 0.15s ease;
  }
  .garage-bay:hover{transform:translateY(-3px);}
  .garage-bay:focus-visible{outline:3px solid var(--gold-dark); outline-offset:3px;}
  .garage-car{
    width:76px;
    height:64px;
  }

  /* ---------- panel ---------- */
  .scrim{
    position:fixed;
    inset:0;
    background:rgba(36,28,21,0.45);
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .panel{
    background:var(--paper);
    border-radius:16px;
    border:2px solid var(--paper-edge);
    padding:26px;
    width:100%;
    max-width:360px;
    box-shadow:0 12px 40px rgba(36,28,21,0.35);
  }
  .panel h2{
    margin:0 0 4px;
    font-size:1.3rem;
  }
  .panel .sub{
    margin:0 0 18px;
    font-size:0.82rem;
    color:var(--ink-soft);
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:16px;
  }
  .field label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    font-weight:700;
  }
  .field input{
    font-family:'Space Mono', monospace;
    font-size:1rem;
    padding:10px 12px;
    border-radius:8px;
    border:1.5px solid var(--paper-edge);
    background:#fff;
    color:var(--ink);
  }
  .field input:focus-visible{outline:3px solid var(--gold-dark); outline-offset:1px;}

  .status-row{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .status-btn{
    flex:1;
    border-radius:8px;
    padding:10px;
    font-size:0.85rem;
    border:1.5px solid var(--paper-edge);
    background:#fff;
    color:var(--ink-soft);
  }
  .status-btn.active-for-sale{
    background:var(--car-red);
    border-color:var(--car-red-dark);
    color:#fff;
  }
  .status-btn.active-sold{
    background:var(--sold-tag);
    border-color:#5d7048;
    color:#fff;
  }
  .panel-actions{
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .panel-actions .right{display:flex; gap:8px;}

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:999px;
    font-size:0.82rem;
    z-index:40;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-width:560px){
    .lawn{width:184px; height:106px;}
    .driveway{width:51px; height:59px;}
    .sprite-house{width:121px; height:121px;}
    .sprite-car{width:47px; height:41px;}
    .house-slot-empty{width:184px;}
    header{padding:14px 16px;}
    .brand h1{font-size:1.3rem;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:0.01ms !important; animation-duration:0.01ms !important;}
    .house-wrap:hover{transform:none;}
    .btn-primary:hover, .btn-primary:active{transform:none;}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 class="display">The Lot</h1>
    <span class="tag">exotic car inventory</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="header-actions">
    <button class="btn-ghost" id="garage-btn" type="button">Garage</button>
    <button class="btn-primary" id="add-btn" type="button">+ Add a car</button>
  </div>
</header>

<main>
  <div id="app"></div>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <h2 id="panel-title" class="display">Add a car</h2>
    <p class="sub" id="panel-sub">Give it a lot number to add it to the street.</p>
    <form id="car-form">
      <div class="field">
        <label for="lot-input">Lot number</label>
        <input id="lot-input" name="lot" type="text" autocomplete="off" placeholder="e.g. A-104" required />
      </div>
      <div class="field">
        <label for="make-input">Make</label>
        <select id="make-input" name="make"></select>
      </div>
      <div class="status-row" role="group" aria-label="Status">
        <button type="button" class="status-btn" id="status-for-sale" data-status="for-sale">For sale</button>
        <button type="button" class="status-btn" id="status-sold" data-status="sold">Sold</button>
      </div>
      <div class="panel-actions">
        <button type="button" class="btn-danger" id="delete-btn" hidden>Delete</button>
        <div class="right">
          <button type="button" class="btn-ghost" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn-primary" id="save-btn">Add to street</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

  };
  var IMG_BUSH = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAICAYAAADA+m62AAAAaklEQVR4nGNgIBIwMjAwMKjIiP7Hp+jOk9eMjDBFSuGWWBXdW3mcgYGBgYEJnyJkOUbdcHO4tZuNUxl8z87GqoHp+9F7cA6yos3GqXD296P3GOBu5LRWwmoSzCCmO09eMyILYFN058lrRgDkayWRyijIEgAAAABJRU5ErkJggg==";

  // Only for-sale cars get a house - once a car is marked sold it moves
  // to the garage (see renderGarageView) instead of sitting in its old
  // driveway. Nothing here is separately saved: both views are just
  // different ways of rendering the same state.cars list filtered by
  // status, so which car is on the street vs. in the garage always
  // matches what was last saved, same as everything else.
  var currentView = "street"; // "street" | "garage"

  // Houses per side before a street segment is full and a new one
  // starts below it (see assignBlocks) - chosen to comfortably fit
  // main's width without needing horizontal scroll on a normal screen.
  var BLOCK_SIZE = 4;

  function renderHouse(car, mirrored){
    var lot = escapeHtml(car.lot || "—");
    var carSprite = CAR_SPRITES[car.make] || CAR_SPRITES[DEFAULT_MAKE];
    // Far-side houses face back across the road toward the near side,
    // so from our fixed viewpoint their cars show from behind.
    var img = mirrored ? carSprite.rearImg : carSprite.img;
    var vehicleHtml = '<img class="sprite sprite-car" src="' + img + '" alt="' + escapeHtml(carSprite.label) + '" />';
    var tagHtml = '<div class="lot-tag mono">' + lot + '</div>';
    var houseHtml = '<img class="sprite sprite-house" src="' + IMG_HOUSE + '" alt="" />';
    var lawnHtml = '<div class="lawn">' +
      '<img class="sprite sprite-bush" src="' + IMG_BUSH + '" alt="" />' +
      '<div class="driveway">' + vehicleHtml + '</div>' +
      '</div>';
    // Near side reads top-to-bottom as tag, house, driveway (driveway
    // closest to the road below it). Far side is the mirror of that -
    // driveway closest to the road above it, house, then the tag - so
    // both sides' driveways sit right against the shared road.
    var inner = mirrored ? (lawnHtml + houseHtml + tagHtml) : (tagHtml + houseHtml + lawnHtml);
    return '<button class="house-wrap" type="button" data-id="' + escapeHtml(car.id) + '" aria-label="Lot ' + lot + ', for sale">' +
      inner +
      '</button>';
  }

  // Groups for-sale cars, in the order they were added, into street
  // segments: the first BLOCK_SIZE cars fill a segment's near side, the
  // next BLOCK_SIZE fill its far side (paired under the same columns as
  // the near side, so house 4 sits across from house 1), then the next
  // BLOCK_SIZE start a new segment's near side, and so on.
  function assignBlocks(cars){
    var perBlock = BLOCK_SIZE * 2;
    var blocks = [];
    for (var i = 0; i < cars.length; i++) {
      var blockIndex = Math.floor(i / perBlock);
      var posInBlock = i % perBlock;
      if (!blocks[blockIndex]) blocks[blockIndex] = { near: [], far: [] };
      if (posInBlock < BLOCK_SIZE) {
        blocks[blockIndex].near[posInBlock] = cars[i];
      } else {
        blocks[blockIndex].far[posInBlock - BLOCK_SIZE] = cars[i];
      }
    }
    return blocks;
  }

  // cols is passed explicitly rather than read off houses.length - the
  // far side is usually shorter than the near side within a block (it
  // fills in after), and still needs empty slots out to the same column
  // count so its houses land under their near-side counterparts.
  function renderRow(houses, cols, mirrored){
    var html = "";
    for (var c = 0; c < cols; c++) {
      html += houses[c] ? renderHouse(houses[c], mirrored) : '<div class="house-slot-empty"></div>';
    }
    return '<div class="houses-row">' + html + '</div>';
  }

  function renderBlock(block){
    var cols = Math.max(block.near.length, block.far.length);
    var html = renderRow(block.near, cols, false) + '<div class="road-h"></div>';
    if (block.far.length > 0) {
      html += renderRow(block.far, cols, true);
    }
    return '<div class="block">' + html + '</div>';
  }

  function renderStreetView(forSaleCars){
    if (forSaleCars.length === 0) {
      return '<div class="empty-state"><h2 class="display">The street is empty</h2><p>Add your first car to start building the lot.</p></div>';
    }
    var blocks = assignBlocks(forSaleCars);
    var html = "";
    for (var b = 0; b < blocks.length; b++) html += renderBlock(blocks[b]);
    return '<div class="street">' + html + '</div>';
  }

  function renderGarageBay(car){
    var lot = escapeHtml(car.lot || "—");
    var carSprite = CAR_SPRITES[car.make] || CAR_SPRITES[DEFAULT_MAKE];
    return '<button class="garage-bay" type="button" data-id="' + escapeHtml(car.id) + '" aria-label="Lot ' + lot + ', sold">' +
      '<img class="sprite garage-car" src="' + carSprite.img + '" alt="' + escapeHtml(carSprite.label) + '" />' +
      '<div class="lot-tag mono">' + lot + '</div>' +
      '</button>';
  }

  function renderGarageView(soldCars){
    if (soldCars.length === 0) {
      return '<div class="empty-state"><h2 class="display">The garage is empty</h2><p>Cars marked sold show up here.</p></div>';
    }
    var cards = "";
    for (var i = 0; i < soldCars.length; i++) cards += renderGarageBay(soldCars[i]);
    return '<div class="garage"><div class="garage-grid">' + cards + '</div></div>';
  }

  function renderApp(){
    var cars = state.cars || [];
    if (currentView === "garage") {
      return renderGarageView(cars.filter(function(c){ return c.status === "sold"; }));
    }
    return renderStreetView(cars.filter(function(c){ return c.status === "for-sale"; }));
  }

  function renderStats(){
    var cars = state.cars || [];
    var forSale = 0, sold = 0;
    for (var i = 0; i < cars.length; i++) {
      if (cars[i].status === "sold") sold++; else forSale++;
    }
    return '<div class="stat for-sale"><b class="mono">' + forSale + '</b><small>For sale</small></div>' +
      '<div class="stat sold"><b class="mono">' + sold + '</b><small>Sold</small></div>' +
      '<div class="stat"><b class="mono">' + cars.length + '</b><small>Total</small></div>';
  }

  function updateGarageButton(){
    var soldCount = (state.cars || []).filter(function(c){ return c.status === "sold"; }).length;
    var btn = document.getElementById("garage-btn");
    btn.textContent = currentView === "garage" ? "← Back to street" : "Garage (" + soldCount + ")";
  }

  function render(){
    document.getElementById("app").innerHTML = renderApp();
    document.getElementById("stats").innerHTML = renderStats();
    updateGarageButton();
  }

  function updateStatusButtons(){
    document.getElementById("status-for-sale").classList.toggle("active-for-sale", pendingStatus === "for-sale");
    document.getElementById("status-sold").classList.toggle("active-sold", pendingStatus === "sold");
  }

  function openPanel(mode, car){
    editingId = mode === "edit" ? car.id : null;
    pendingStatus = car ? car.status : "for-sale";
    document.getElementById("panel-title").textContent = mode === "edit" ? "Edit car" : "Add a car";
    document.getElementById("panel-sub").textContent = mode === "edit"
      ? "Update the lot number, make, or status, or remove it from the street."
      : "Give it a lot number to add it to the street.";
    document.getElementById("lot-input").value = car ? car.lot : "";
    document.getElementById("make-input").value = car ? (car.make || DEFAULT_MAKE) : DEFAULT_MAKE;
    document.getElementById("save-btn").textContent = mode === "edit" ? "Save changes" : "Add to street";
    document.getElementById("delete-btn").hidden = mode !== "edit";
    updateStatusButtons();
    document.getElementById("scrim").hidden = false;
    document.getElementById("lot-input").focus();
  }

  function closePanel(){
    document.getElementById("scrim").hidden = true;
    editingId = null;
  }

  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }

  // Cache locally first (instant, works offline), then push to the shared
  // store so every other device sees the change too.
  function persist(){
    try { localStorage.setItem("the-lot-state", JSON.stringify(state)); } catch (e) {}
    fetch("/api/lot", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    }).then(function(res){
      if (!res.ok) throw new Error("save failed: " + res.status);
    }).catch(function(){
      showToast("Couldn't save to the shared lot — kept on this device only.");
    });
  }

  // Pulls the shared state on load so every device stays in sync; if the
  // request fails (offline, cold start) the page just keeps what's cached
  // locally rather than erroring out.
  function syncFromServer(){
    fetch("/api/lot").then(function(res){
      if (!res.ok) throw new Error("load failed: " + res.status);
      return res.json();
    }).then(function(data){
      if (!data || !Array.isArray(data.cars)) return;
      state = data;
      try { localStorage.setItem("the-lot-state", JSON.stringify(state)); } catch (e) {}
      render();
    }).catch(function(){});
  }

  document.getElementById("app").addEventListener("click", function(e){
    var btn = e.target.closest(".house-wrap, .garage-bay");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var car = null;
    for (var i = 0; i < state.cars.length; i++) { if (state.cars[i].id === id) { car = state.cars[i]; break; } }
    if (car) openPanel("edit", car);
  });

  document.getElementById("add-btn").addEventListener("click", function(){ openPanel("add", null); });

  document.getElementById("garage-btn").addEventListener("click", function(){
    currentView = currentView === "garage" ? "street" : "garage";
    render();
  });

  var statusBtns = document.querySelectorAll(".status-btn");
  for (var s = 0; s < statusBtns.length; s++) {
    statusBtns[s].addEventListener("click", function(){
      pendingStatus = this.getAttribute("data-status");
      updateStatusButtons();
    });
  }

  document.getElementById("cancel-btn").addEventListener("click", closePanel);
  document.getElementById("scrim").addEventListener("click", function(e){
    if (e.target.id === "scrim") closePanel();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !document.getElementById("scrim").hidden) closePanel();
  });

  document.getElementById("delete-btn").addEventListener("click", function(){
    if (!editingId) return;
    state.cars = state.cars.filter(function(c){ return c.id !== editingId; });
    render();
    closePanel();
    persist();
    showToast("Removed from the street");
  });

  document.getElementById("car-form").addEventListener("submit", function(e){
    e.preventDefault();
    var lot = document.getElementById("lot-input").value.trim();
    if (!lot) return;
    var make = document.getElementById("make-input").value || DEFAULT_MAKE;
    var wasEditing = !!editingId;
    if (editingId) {
      for (var i = 0; i < state.cars.length; i++) {
        if (state.cars[i].id === editingId) {
          state.cars[i].lot = lot;
          state.cars[i].status = pendingStatus;
          state.cars[i].make = make;
          break;
        }
      }
    } else {
      state.cars.push({ id: genId(), lot: lot, status: pendingStatus, make: make });
    }
    render();
    closePanel();
    persist();
    showToast(wasEditing ? "Saved" : "Added to the street");
  });

  function populateMakeOptions(){
    var select = document.getElementById("make-input");
    var html = "";
    for (var key in CAR_SPRITES) {
      if (!CAR_SPRITES.hasOwnProperty(key)) continue;
      html += '<option value="' + escapeHtml(key) + '">' + escapeHtml(CAR_SPRITES[key].label) + '</option>';
    }
    select.innerHTML = html;
  }

  populateMakeOptions();
  render();
  syncFromServer();
})();
</script>
